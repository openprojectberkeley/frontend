<!-- The Open Project mark as pixel art: LogoMark's disc, bar and arc (no
     paper shadow) on an 18x21 grid over its 896x1024 frame. A cell is filled
     if the shapes cover at least half of it, and is otherwise empty - no
     part-transparent edges. Layered as in LogoMark: a cell takes the colour
     of the topmost shape covering half of it - arc, then bar, then disc - so
     the disc sits behind the other two; failing that, of whichever covers
     most. Stretched to LogoMark's box, it sits where LogoMark does. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 21" shape-rendering="crispEdges" preserveAspectRatio="none">
